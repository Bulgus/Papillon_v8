name: Feather

# Builds Papillon (Expo) unsigned and publishes it to Aimé's Feather source
# (Bulgus/feather-repo), like feather-repo's reusable publish.yml does, which
# cannot build an Expo app: it needs bun, expo prebuild, CocoaPods and the
# iOS 27 SDK. Feather signs the IPA on install.

on: [push, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: feather-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish to Feather
    if: github.repository != 'PapillonApp/Papillon'
    # PapillonKit (Siri, Apple Intelligence) needs the iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      SCHEME: Papillon
      BUNDLE_ID: xyz.getpapillon.ios
      APP_NAME: Papillon
      FEATHER_REPO: Bulgus/feather-repo

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(xcode-select -p | sed 's#/Contents/Developer##')
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install tools
        run: |
          brew install ccache || true
          gem list cocoapods -i || sudo gem install cocoapods

      - name: Install dependencies
        # Frozen: an unpinned install once pulled expo-modules-core 58.0.30,
        # which needs React Native 0.88.0 final, and crashed the app at launch
        # (dyld: symbol RCTStatusBarAppearance not found).
        run: bun install --frozen-lockfile

      - name: Prebuild iOS project
        env:
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Papillon.xcworkspace \
            -scheme Papillon \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Papillon.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|\*\* (ARCHIVE|BUILD) (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/Papillon.xcarchive/Products/Applications/Papillon.app"

      - name: Check dynamic linking (launch crash guard)
        run: python3 scripts/ios-link-check.py "$RUNNER_TEMP/Papillon.xcarchive/Products/Applications/Papillon.app"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          BUILD=${{ github.run_number }}
          APP_PATH="$RUNNER_TEMP/Papillon.xcarchive/Products/Applications/Papillon.app"
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist")
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          # Leftover signatures from the build would confuse re-signers.
          find Payload -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          IPA="$SCHEME-$VER-$BUILD.ipa"
          zip -qry "$IPA" Payload
          du -h "$IPA"
          {
            echo "VER=$VER"; echo "BUILD=$BUILD"
            echo "IPA=$RUNNER_TEMP/$IPA"; echo "IPA_FILE=$IPA"
            echo "TAG=$SCHEME-$VER-$BUILD"
          } >> "$GITHUB_ENV"

      - name: Upload IPA as release
        env:
          GH_TOKEN: ${{ secrets.FEATHER_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret FEATHER_TOKEN unavailable for this repository"
            exit 1
          fi
          MSG="[${GITHUB_REF_NAME}] $(echo "${COMMIT_MSG:-build manuel}" | head -1)"
          echo "MSG=$MSG" >> "$GITHUB_ENV"
          gh release create "$TAG" "$IPA" --repo "$FEATHER_REPO" \
            --title "$APP_NAME $VER ($BUILD)" --notes "$MSG"

      - name: Update source.json
        env:
          GH_TOKEN: ${{ secrets.FEATHER_TOKEN }}
        run: |
          SIZE=$(stat -f%z "$IPA")
          URL="https://github.com/$FEATHER_REPO/releases/download/$TAG/$IPA_FILE"
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/$FEATHER_REPO.git" "$RUNNER_TEMP/feather"
          cd "$RUNNER_TEMP/feather"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          update() {
            jq --arg id "$BUNDLE_ID" --arg name "$APP_NAME" \
               --arg v "$VER.$BUILD" --arg b "$BUILD" --arg d "$(date -u +%FT%TZ)" \
               --arg u "$URL" --argjson s "$SIZE" --arg m "$MSG" '
              (if any(.apps[]; .bundleIdentifier == $id) then .
               else .apps += [{name:$name, bundleIdentifier:$id, developerName:"Aimé",
                               localizedDescription:$name, versions:[]}] end)
              | (.apps[] | select(.bundleIdentifier == $id) | .versions) |=
                  ([{version:$v, buildVersion:$b, date:$d, downloadURL:$u,
                     size:$s, localizedDescription:$m}] + . | .[:10])
            ' source.json > tmp.json && mv tmp.json source.json
          }

          for i in 1 2 3; do
            update
            git commit -qam "$APP_NAME $VER ($BUILD)"
            git push -q && break
            git reset -q --hard HEAD~1 && git pull -q --rebase
          done

      - name: Notify (ntfy)
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          [ -n "$NTFY_URL" ] && curl -s -H "Title: $APP_NAME $VER ($BUILD)" \
            -d "$MSG — dispo dans Feather" "$NTFY_URL" || true
