name: Feather

# Builds Papillon (Expo) unsigned, then hands the IPA to feather-repo's
# publish-ipa.yml, which publishes it to Aimé's Feather source (release,
# source.json, ntfy). The build stays here rather than in publish.yml because
# of the launch-crash guard, which inspects the built app after xcodebuild.
# Feather signs the IPA on install.

on: [push, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: feather-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    if: github.repository != 'PapillonApp/Papillon'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bunx jest --ci

  build:
    name: Build unsigned IPA
    # No build (nor publication) when a test fails.
    needs: test
    if: github.repository != 'PapillonApp/Papillon'
    # PapillonKit (Siri, Apple Intelligence) needs the iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 150
    outputs:
      version: ${{ steps.ipa.outputs.version }}
      build: ${{ steps.ipa.outputs.build }}

    steps:
      # Personal repo: the organisation secrets do not apply. Only says whether
      # they are set, never their value.
      - name: Check Feather secrets
        env:
          HAS_TOKEN: ${{ secrets.FEATHER_TOKEN != '' }}
          HAS_NTFY: ${{ secrets.NTFY_URL != '' }}
        run: |
          echo "FEATHER_TOKEN set: $HAS_TOKEN · NTFY_URL set: $HAS_NTFY"
          {
            echo "### Feather secrets"
            echo "- FEATHER_TOKEN: $HAS_TOKEN"
            echo "- NTFY_URL (optionnel): $HAS_NTFY"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$HAS_TOKEN" = "true" ] || echo "::warning::FEATHER_TOKEN missing: add it in Settings › Secrets and variables › Actions"
          # NTFY_URL is optional: without it the build is published, just not notified.
          [ "$HAS_NTFY" = "true" ] || echo "::notice::NTFY_URL not set (optional): published without ntfy notification"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(xcode-select -p | sed 's#/Contents/Developer##')
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install tools
        run: |
          brew install ccache || true
          gem list cocoapods -i || sudo gem install cocoapods

      - name: Install dependencies
        # Frozen: an unpinned install once pulled expo-modules-core 58.0.30,
        # which needs React Native 0.88.0 final, and crashed the app at launch
        # (dyld: symbol RCTStatusBarAppearance not found).
        run: bun install --frozen-lockfile

      - name: Prebuild iOS project
        env:
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Papillon.xcworkspace \
            -scheme Papillon \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Papillon.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|\*\* (ARCHIVE|BUILD) (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/Papillon.xcarchive/Products/Applications/Papillon.app"

      - name: Check dynamic linking (launch crash guard)
        run: python3 scripts/ios-link-check.py "$RUNNER_TEMP/Papillon.xcarchive/Products/Applications/Papillon.app"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Package IPA
        id: ipa
        run: |
          BUILD=${{ github.run_number }}
          APP_PATH="$RUNNER_TEMP/Papillon.xcarchive/Products/Applications/Papillon.app"
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist")
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          # Leftover signatures from the build would confuse re-signers.
          find Payload -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          zip -qry app.ipa Payload
          du -h app.ipa
          { echo "version=$VER"; echo "build=$BUILD"; } >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/app.ipa
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    uses: Bulgus/feather-repo/.github/workflows/publish-ipa.yml@main
    with:
      bundle_id: xyz.getpapillon.ios
      app_name: Papillon
      version: ${{ needs.build.outputs.version }}
      build: ${{ needs.build.outputs.build }}
    secrets: inherit
